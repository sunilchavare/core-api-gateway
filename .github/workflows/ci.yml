name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: core_api_gateway
          POSTGRES_USER: coreapi
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coreapi -d core_api_gateway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Throwaway values for CI only; no real secrets are used here.
    env:
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+psycopg://coreapi:ci_password@localhost:5432/core_api_gateway
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      DOWNSTREAM_HELLO_URL: http://127.0.0.1:8001
      DOWNSTREAM_TIMEOUT: "3"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Start the demo downstream service
        run: |
          nohup uvicorn app.downstream:downstream_app --port 8001 > downstream.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8001/hello && break
            sleep 1
          done

      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # TODO: add `npm run lint` after the frontend lint error is fixed.
      - run: npm run build
